<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIGNAL Conversation Lab — Staging</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#102f34;font-family:Arial,sans-serif}
body{display:grid;place-items:center;padding:22px}
.badge{position:fixed;z-index:10;top:8px;left:50%;transform:translateX(-50%);padding:6px 11px;border-radius:999px;background:rgba(10,40,44,.92);color:white;font-size:9px;font-weight:800;letter-spacing:.12em;box-shadow:0 6px 22px rgba(0,0,0,.25)}
.canvas{position:relative;width:min(1180px,100%);aspect-ratio:1086/810;background-image:url("assets/landing-approved.webp");background-repeat:no-repeat;background-size:100% auto;background-position:center top;box-shadow:0 24px 90px rgba(0,0,0,.35);overflow:hidden}
.start{position:absolute;left:6.6%;top:73.1%;width:28.5%;height:8.4%;border-radius:999px;display:block;cursor:pointer}
.start:focus-visible{outline:4px solid #fff;outline-offset:4px}
.save{position:absolute;right:4.1%;top:1.5%;width:13.7%;height:5.6%;border-radius:999px;display:block;cursor:pointer}
.save:focus-visible{outline:4px solid #fff;outline-offset:4px}
@media(max-width:700px){
 body{padding:0;background:#f8f0e5;align-items:start}
 .canvas{width:100%;box-shadow:none}
 .badge{font-size:8px}
}
</style>
</head>
<body>
<div class="badge">STAGING • NOT LIVE</div>
<main class="canvas" aria-label="SIGNAL Conversation Lab introductory experience">
  <a class="start" href="s.html" aria-label="Start the Conversation"></a>
  <a class="save" href="register.html" aria-label="Save My Spot"></a>
</main>
</body>
</html>
